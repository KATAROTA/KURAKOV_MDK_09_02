<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Менеджер задач</title>
    <style>
      .completed > span {
        text-decoration: line-through;
      }

      .field-error {
        color: red;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Менеджер задач</h1>

      <form id="task-form" novalidate>
        <label id="title-label" for="task-title">Новая задача</label>
        <div>
          <input
            id="task-title"
            name="title"
            type="text"
            minlength="3"
            maxlength="80"
            required
            placeholder="повторить"
            aria-describedby="title-error"
          />
          <button id="submit-button" type="submit">Добавить</button>
          <button id="cancel-edit" type="button" hidden>Отмена</button>
        </div>
        <p id="title-error" class="field-error" aria-live="polite"></p>
      </form>

      <div>
        <div>
          <label for="task-filter">Показать</label>
          <select id="task-filter">
            <option value="all">Все задачи</option>
            <option value="active">Активные</option>
            <option value="completed">Выполненные</option>
          </select>
        </div>
        <button id="clear-completed" type="button">Очистить выполненные</button>
      </div>

      <div aria-live="polite">
        <p id="task-count">Всего задач: 0</p>
        <p id="active-count">Активных задач: 0</p>
      </div>

      <ul id="task-list"></ul>
    </main>
  </body>
</html>
