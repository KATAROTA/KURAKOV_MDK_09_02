<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JS-03. Работа с API</title>
</head>
<body>
    <h1>Список пользователей</h1>
    <input type="text" id="search" placeholder="Поиск по имени или городу">
    <button id="load">Обновить список</button>
    <p id="status"></p>
    <ul id="users"></ul>

    <script>
        const search = document.getElementById("search");
        const loadButton = document.getElementById("load");
        const status = document.getElementById("status");
        const list = document.getElementById("users");
        let users = [];

        function showUsers() {
            list.innerHTML = "";
            const query = search.value.trim().toLowerCase();
            const found = users.filter(user =>
                user.name.toLowerCase().includes(query) ||
                user.address.city.toLowerCase().includes(query)
            );

            if (found.length === 0) {
                status.textContent = "Ничего не найдено";
                return;
            }

            found.forEach(user => {
                const item = document.createElement("li");
                item.textContent = `${user.name} — ${user.email}, ${user.address.city}`;
                list.append(item);
            });
            status.textContent = `Найдено пользователей: ${found.length}`;
        }

        async function loadUsers() {
            status.textContent = "Загрузка...";
            loadButton.disabled = true;
            list.innerHTML = "";
            users = [];

            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                if (!response.ok) {
                    throw new Error("Ошибка HTTP: " + response.status);
                }
                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error("Неверный формат данных");
                }
                users = data;
                showUsers();
            } catch (error) {
                status.textContent = "Не удалось получить данные";
                console.error(error);
            } finally {
                loadButton.disabled = false;
            }
        }

        loadButton.addEventListener("click", loadUsers);
        search.addEventListener("input", () => {
            if (users.length > 0) showUsers();
        });
        loadUsers();
    </script>
</body>
</html>
