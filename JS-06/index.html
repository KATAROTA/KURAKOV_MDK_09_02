<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
</head>
<body>
    <h1>Список задач</h1>
    <form id="form">
        <input id="title" placeholder="Задача (3–80 символов)" maxlength="80">
        <input id="priority" type="number" placeholder="Приоритет 1–3" min="1" max="3">
        <button type="submit">Добавить</button>
    </form>
    <p id="message"></p>
    <ul id="tasks"></ul>
    <button id="clear" type="button">Удалить все</button>
    <script src="script.js"></script>
</body>
</html>
